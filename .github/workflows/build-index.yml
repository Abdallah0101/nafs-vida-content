name: Gerar posts.json

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
      - "scripts/build_index.py"
      - ".github/workflows/build-index.yml"

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar posts.json
        run: python3 scripts/build_index.py

      - name: Commit e push do índice
        run: |
          if git diff --quiet posts.json; then
            echo "posts.json já estava atualizado."
            exit 0
          fi
          git config user.name "nafs-vida-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts.json
          git commit -m "chore: regenerar posts.json [skip ci]"
          git push
